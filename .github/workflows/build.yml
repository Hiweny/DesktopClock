name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe
        run: >
          dotnet publish src/DesktopClock/DesktopClock.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o out/single

      - name: Publish folder build (no self-extract, antivirus friendly)
        run: >
          dotnet publish src/DesktopClock/DesktopClock.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=none
          -o out/folder

      - name: Zip folder build
        shell: pwsh
        run: Compress-Archive -Path out/folder/* -DestinationPath out/DesktopClock-folder.zip -Force

      - name: Smoke test (launch + show-desktop restore + z-order lock)
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int cmd);
            [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr after, int x, int y, int cx, int cy, uint flags);
            [DllImport("user32.dll")] public static extern IntPtr GetWindow(IntPtr h, uint cmd);
          }
          "@

          $log = Join-Path $env:LOCALAPPDATA "DesktopClock\DesktopClock.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $exe = (Resolve-Path "out/single/DesktopClock.exe").Path
          Write-Host "launch: $exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12

          if ($p.HasExited) {
            Write-Host "::error::EXITED early, code=$($p.ExitCode)"
            if (Test-Path $log) { Get-Content $log }
            exit 1
          }
          Write-Host "OK: process alive, pid=$($p.Id)"

          $m = Select-String -Path $log -Pattern 'hwnd = (\d+)' | Select-Object -Last 1
          if (-not $m) {
            Write-Host "::error::hwnd not found in log"; Get-Content $log; Stop-Process -Id $p.Id -Force; exit 1
          }
          $h = [IntPtr][int64]$m.Matches[0].Groups[1].Value
          Write-Host "hwnd = $h"

          Write-Host "T1: simulating Win+D / Show Desktop (SW_MINIMIZE)..."
          [void][W]::ShowWindow($h, 6)
          Start-Sleep -Seconds 3
          $iconic = [W]::IsIconic($h)
          Write-Host "T1 IsIconic after Show Desktop = $iconic"

          Write-Host "T2: trying to force the clock to the top (HWND_TOP)..."
          [void][W]::SetWindowPos($h, [IntPtr]::Zero, 0, 0, 0, 0, 0x0003) # HWND_TOP, NOSIZE|NOMOVE
          Start-Sleep -Seconds 2
          $above = [W]::GetWindow($h, 3) # GW_HWNDPREV
          Write-Host "T2 window above clock = $above (0 means clock jumped to top)"

          Write-Host "---- LOG ----"
          Get-Content $log
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

          $fail = $false
          if ($iconic) { Write-Host "::error::T1 clock did NOT come back after Show Desktop"; $fail = $true }
          if ($above -eq [IntPtr]::Zero) { Write-Host "::error::T2 z-order lock failed: clock jumped to top"; $fail = $true }
          if ($fail) { exit 1 }
          Write-Host "smoke test passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopClock
          path: |
            out/single/DesktopClock.exe
            out/DesktopClock-folder.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DesktopClock ${{ github.ref_name }}
          files: |
            out/single/DesktopClock.exe
            out/DesktopClock-folder.zip
          generate_release_notes: true
