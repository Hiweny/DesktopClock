name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe
        run: >
          dotnet publish src/DesktopClock/DesktopClock.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o out/single

      - name: Publish folder build (no self-extract, antivirus friendly)
        run: >
          dotnet publish src/DesktopClock/DesktopClock.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=none
          -o out/folder

      - name: Zip builds
        shell: pwsh
        run: |
          Compress-Archive -Path out/folder/* -DestinationPath out/DesktopClock-folder.zip -Force
          Compress-Archive -Path out/single/DesktopClock.exe -DestinationPath out/DesktopClock-exe.zip -Force

      - name: Smoke test (launch + autostart registry)
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "DesktopClock\DesktopClock.log"
          if (Test-Path $log) { Remove-Item $log -Force }

          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          Remove-ItemProperty -Path $runKey -Name DesktopClock -ErrorAction SilentlyContinue

          $exe = (Resolve-Path "out/single/DesktopClock.exe").Path
          Write-Host "launch: $exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12

          if ($p.HasExited) {
            Write-Host "::error::EXITED early, code=$($p.ExitCode)"
            if (Test-Path $log) { Get-Content $log }
            exit 1
          }
          Write-Host "OK: process alive, pid=$($p.Id)"

          $val = (Get-ItemProperty -Path $runKey -Name DesktopClock -ErrorAction SilentlyContinue).DesktopClock
          Write-Host "Run registry entry = $val"
          Write-Host "---- LOG ----"
          if (Test-Path $log) { Get-Content $log }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

          $fail = $false
          if (-not $val) { Write-Host "::error::autostart registry entry was NOT written"; $fail = $true }
          elseif ($val -notlike "*DesktopClock.exe*") { Write-Host "::error::autostart entry points to wrong path: $val"; $fail = $true }
          if ($fail) { exit 1 }
          Write-Host "smoke test passed (autostart registered)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopClock
          path: |
            out/single/DesktopClock.exe
            out/DesktopClock-exe.zip
            out/DesktopClock-folder.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DesktopClock ${{ github.ref_name }}
          files: |
            out/single/DesktopClock.exe
            out/DesktopClock-exe.zip
            out/DesktopClock-folder.zip
          generate_release_notes: true
