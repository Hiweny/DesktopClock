name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe
        run: >
          dotnet publish src/DesktopClock/DesktopClock.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o out/single

      - name: Publish folder build (no self-extract, antivirus friendly)
        run: >
          dotnet publish src/DesktopClock/DesktopClock.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=none
          -o out/folder

      - name: Zip folder build
        shell: pwsh
        run: Compress-Archive -Path out/folder/* -DestinationPath out/DesktopClock-folder.zip -Force

      - name: Smoke test (launch + show-desktop restore)
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string cls, string title);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int cmd);
            [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr h);
          }
          "@

          $log = Join-Path $env:LOCALAPPDATA "DesktopClock\DesktopClock.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $exe = (Resolve-Path "out/single/DesktopClock.exe").Path
          Write-Host "launch: $exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12

          if ($p.HasExited) {
            Write-Host "::error::EXITED early, code=$($p.ExitCode)"
            if (Test-Path $log) { Get-Content $log }
            exit 1
          }

          $h = [W]::FindWindow($null, "DesktopClock")
          Write-Host "window handle = $h"
          if ($h -eq [IntPtr]::Zero) {
            Write-Host "::error::window not found by title"
            if (Test-Path $log) { Get-Content $log }
            Stop-Process -Id $p.Id -Force
            exit 1
          }

          Write-Host "simulating Win+D / Show Desktop (SW_MINIMIZE)..."
          [void][W]::ShowWindow($h, 6)
          Start-Sleep -Seconds 3
          $iconic = [W]::IsIconic($h)
          Write-Host "IsIconic after show-desktop = $iconic"

          if (Test-Path $log) { Write-Host "---- LOG ----"; Get-Content $log }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

          if ($iconic) {
            Write-Host "::error::clock did NOT come back after Show Desktop"
            exit 1
          }
          Write-Host "smoke test passed (clock survives Show Desktop)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopClock
          path: |
            out/single/DesktopClock.exe
            out/DesktopClock-folder.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DesktopClock ${{ github.ref_name }}
          files: |
            out/single/DesktopClock.exe
            out/DesktopClock-folder.zip
          generate_release_notes: true
